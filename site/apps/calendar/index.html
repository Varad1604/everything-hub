    <!-- Booking links read `calendar.ehub.com/#/<host>/<page>` (see linkFor in
         src/js/booking.js). They land on the app shell but belong to the guest
         booking page, public/book.html — no sign-in, no SDK, none of the app —
         so hand them over here, before anything else loads; `replace`, so Back
         never returns to a page that only ever forwarded. The grammar is
         exact: the label of a `cal-<host>.ehub.work` worker and a page slug —
         lowercase letters, digits, hyphens, nothing else — so this can only
         ever forward to the sibling booking page, never anywhere a crafted
         link might point. Lowercased first: these links get read out and
         retyped, hostnames are case-insensitive, and page ids are stored
         lowercase. Any other hash (or an exception here) leaves the calendar
         to boot as usual. Checked again on every hashchange: a booking link
         pasted into a tab that already shows the calendar changes only the
         fragment — a same-document navigation, which reloads nothing — and
         would otherwise be silently ignored. Kept in step with the same test
         in src/js/booking.js and public/book.html. -->
    <script>
      (function () {
        function forward() {
          try {
            var m = /^#\/([a-z0-9][a-z0-9-]{0,58})\/([a-z0-9][a-z0-9-]{2,30}[a-z0-9])$/.exec(
              String(location.hash).toLowerCase(),
            );
            if (m) location.replace('book.html#/' + m[1] + '/' + m[2]);
          } catch (_e) {
            /* not a booking route we can act on — boot the calendar */
          }
        }
        forward();
        try {
          addEventListener('hashchange', forward);
        } catch (_e) {
          /* the load-time check above still ran */
        }
      })();
    </script>

    <!-- Paint the user's explicit theme before anything loads: the
         authoritative applyTheme runs only after the SDK, the session, and
         the whole calendar have loaded, so an explicit-dark user on a
         light-OS device watched every boot screen render light for seconds.
         The offline snapshot (see src/js/offline-store.js) already holds the
         last-synced settings — read them synchronously, best-effort; main.js
         re-applies the theme once the calendar is loaded, correcting any
         drift (a theme changed on another device, a different account). -->
    <script>
      (function () {
        try {
          var blob = JSON.parse(localStorage.getItem('cal:snapshot') || 'null');
          var raw = blob && blob.entries && blob.entries['cal:settings'];
          var settings = typeof raw === 'string' ? JSON.parse(raw) : raw;
          var theme = settings && settings.theme;
          if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        } catch (_e) {
          /* no snapshot / blocked storage — the OS theme stands until load */
        }
      })();
    </script>

    <!-- Everything Hub: the only backend dependency (auth, key-value storage, context menu). -->
    <!-- When another Everything Hub app launches the calendar as its headless API (see
         src/js/api/protocol.js) there is nothing to show. The Everything Hub desktop
         creates and shows an app's window before the app itself loads, so hide
         it here — the earliest moment the SDK exists — rather than waiting for
         the app bundle, which would flash an empty window on screen. main.js
         hides again; this pass is purely cosmetic and must never throw. -->
    <script>
      (function () {
        try {
          var raw = new URLSearchParams(location.search).get('ehub.args') || '';
          // Keep in step with SERVICE_ARGS in src/js/api/protocol.js.
          if (!/"service"\s*:\s*"calendar-api"/.test(raw)) return;
          if (window.ehub && ehub.ui && typeof ehub.ui.hideWindow === 'function') {
            ehub.ui.hideWindow();
          }
        } catch (_e) {
          /* main.js will hide the window a moment later */
        }
      })();
    </script>
